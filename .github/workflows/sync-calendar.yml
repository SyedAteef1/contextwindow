# Calendar sync on a 15-minute cadence, for free.
#
# Vercel's Hobby plan caps cron jobs at once per day — a more frequent
# expression fails at deploy time — and a daily sync is too coarse: a meeting
# booked at 09:00 for 14:00 would never get a bot or a brief. Rather than pay
# for Vercel Pro purely for scheduling, this workflow calls the same endpoint.
#
# Setup: add CRON_SECRET and APP_URL as repository secrets.
#
# Two caveats worth knowing. GitHub delays scheduled runs under load, so treat
# 15 minutes as a floor rather than a guarantee. And on public repositories
# GitHub disables scheduled workflows after 60 days without commits — the
# `vercel.json` daily cron is the backstop for both.
name: Sync calendars

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  # A slow sync must not have the next run pile up behind it.
  group: sync-calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger calendar sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/sync-calendar")

          echo "HTTP ${status}"
          # Summarise without echoing the body — it names accounts and meetings.
          jq -r '.totals | "users=\(.users) created=\(.created) bots=\(.botsScheduled) briefs=\(.briefsGenerated) quotaSkipped=\(.quotaSkipped) errors=\(.errors)"' \
            /tmp/response.json 2>/dev/null || echo "(no parseable summary)"

          if [ "$status" != "200" ]; then
            echo "Calendar sync failed with HTTP ${status}" >&2
            exit 1
          fi
