# One container per bot.
#
# Attendee's default launch method runs every bot inside the shared Celery
# worker process. That is why three concurrent bots pinned this machine at 961%
# CPU and the fourth never left `joining`: the bots were competing for the same
# process, and Celery could not fork.
#
# `docker-compose-multi-host` moves each bot into its own ephemeral container
# with its own CPU and memory limit, auto-removed when the call ends. A bot that
# misbehaves now starves itself instead of the whole host, and concurrency is
# bounded by an explicit number rather than by whatever the box happens to
# survive.
#
# Linux hosts only. The launcher gives bot containers `network_mode: host`, which
# does not work on Docker Desktop for macOS -- locally, use the arm64 compose
# instead so the worker stops running under x86 emulation.
#
#   docker compose -f dev.docker-compose.yaml -f docker-compose.bots.yaml up -d

services:
  # Hands bots to the launcher instead of running them in-process.
  attendee-app-local:
    environment:
      - LAUNCH_BOT_METHOD=docker-compose-multi-host

  attendee-scheduler-local:
    environment:
      - LAUNCH_BOT_METHOD=docker-compose-multi-host

  attendee-worker-local:
    environment:
      - LAUNCH_BOT_METHOD=docker-compose-multi-host

  # Consumes the `bot_launcher_vm` queue and does nothing but start containers.
  # Each task returns in ~2 seconds, so a single worker keeps up with far more
  # bots than the host can actually run.
  attendee-bot-launcher:
    build: ./
    volumes:
      - .:/attendee
      # The launcher starts sibling containers on the host's daemon; it does not
      # run them inside itself.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - attendee_network
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/5
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - ENABLE_CHROME_SANDBOX=false

      # The image bots run. Same one the worker uses.
      - BOT_CONTAINER_IMAGE=attendee-attendee-worker-local:latest
      # Absolute path to this checkout *on the host*, bind-mounted into each bot.
      - BOT_HOST_CODE_PATH=/opt/attendee

      # Per-bot budget. 100000/100000 is one core. Attendee's own Kubernetes
      # default asks for four cores per bot; one is enough for audio-only Meet
      # capture, and is what keeps a mid-size box useful.
      - BOT_CPU_QUOTA=100000
      - BOT_CPU_PERIOD=100000
      - BOT_MEMORY_LIMIT=2g

      # The ceiling that used to be implicit. Past this the launch task retries
      # with backoff rather than overcommitting the host.
      #   c7g.2xlarge  (8 vCPU / 16 GB) -> 5
      #   c7g.4xlarge (16 vCPU / 32 GB) -> 12
      - BOT_MAX_SIMULTANEOUS_BOTS=5

      # Containers vanish on exit. Flip to false when debugging a failed join.
      - BOT_CONTAINER_AUTO_REMOVE=true
    command: "celery -A attendee worker -l INFO -Q bot_launcher_vm -c 4"

# Restart policy.
#
# The upstream dev compose sets `unless-stopped` on postgres and redis but not
# on the app, worker or scheduler — so a host reboot brought the databases back
# and left the bot services down, which looks like "bots stopped working" with
# nothing in the logs to explain it.
services:
  attendee-app-local:
    restart: unless-stopped
  attendee-worker-local:
    restart: unless-stopped
  attendee-scheduler-local:
    restart: unless-stopped
